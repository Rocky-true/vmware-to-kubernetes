apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: course-selection
  labels:
    app: mysql
spec:
  selector:
    app: mysql
  ports:
  - name: http
    port: 3306
    targetPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: course-selection
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
  - name: http
    port: 6379
    targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: course-selection
  labels:
    app: app
spec:
  selector:
    app: app
  ports:
  - name: http
    port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: course-selection
  labels:
    app: nginx
spec:
  selector:
    app: nginx
  ports:
  - name: http
    port: 80
    targetPort: 80
