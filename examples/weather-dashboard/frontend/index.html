<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Weather Dashboard</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:820px;margin:40px auto;padding:0 16px;background:#f5f8fb}
  h1{color:#1f4e79}
  #city{color:#666;margin-bottom:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
  .card{background:#fff;border-radius:10px;padding:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .deg{font-size:22px;font-weight:700;color:#1f4e79}
  .cond{font-size:12px;color:#777;margin-top:4px}
</style>
</head>
<body>
<h1>🌤️ Weather Dashboard</h1>
<div id="city">加载中...</div>
<div class="grid" id="grid"></div>
<script>
async function load(){
  const data = await (await fetch('/api/weather')).json();
  document.getElementById('city').textContent = `城市：${data.city}（${data.updated}）`;
  document.getElementById('grid').innerHTML = data.days.map(d=>`
    <div class="card">
      <div>${d.day}</div>
      <div class="deg">${d.temp}°C</div>
      <div class="cond">${d.cond}</div>
    </div>`).join('');
}
load();
</script>
</body>
</html>
