services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: library
      POSTGRES_DB: library
      POSTGRES_PASSWORD: library_pass_2026
    expose:
      - "5432"
    volumes:
      - library-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build: ./backend
    image: library-backend:1.0
    env_file:
      - app.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: library
      DB_NAME: library
      DB_PASSWORD: library_pass_2026
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    working_dir: /app
    expose:
      - "8000"
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.20"
          memory: 128M
    labels:
      tier: backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: nginx:1.27-alpine
    ports:
      - "8084:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - backend
    labels:
      tier: frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  library-data:
